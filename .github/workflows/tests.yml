name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: |
          pip install --no-cache-dir --only-binary=:all: poetry==2.4.1
      - name: Install dependencies
        env:
          POETRY_INSTALLER_ONLY_BINARY: ':all:'
          POETRY_INSTALLER_NO_BINARY: 'csscompressor,jsmin'
        run: |
          poetry install --with test --extras appium --extras selenium --extras playwright --extras google-vision --extras llm --extras mcp
          poetry run pip install --only-binary=:all: robotframework==7.5.1
      - name: Install Chromium
        env:
          POETRY_INSTALLER_ONLY_BINARY: ':all:'
        run: poetry run playwright install --with-deps chromium
      - name: Run tests
        run: poetry run pytest -c pytest.toml --no-cov -q

  # The desktop suite needs a real Host: the xa11y driver's Linux container, or a
  # Windows runner prepared by the driver's own setup script. macOS runners need
  # Accessibility and Screen Recording grants, so macOS runs on a prepared Mac.
  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows
    permissions:
      contents: read
    env:
      OPTICS_E2E_XA11Y_URL: http://127.0.0.1:4723
      OPTICS_E2E_XA11Y_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: chinmayajha/appium-xa11y-driver
          ref: af5889dd397920e5b59c9167ec592e6943d05466 # v0.1.2
          path: xa11y-driver
      - name: Start the Linux Host
        if: runner.os == 'Linux'
        run: |
          docker build -q -f xa11y-driver/docker/linux/Dockerfile -t appium-xa11y-linux xa11y-driver
          docker run -d --name appium -p 127.0.0.1:4723:4723 appium-xa11y-linux
      - name: Prepare the Windows Host
        if: runner.os == 'Windows'
        shell: powershell
        run: xa11y-driver/hosts/windows/setup.ps1 -Driver xa11y-driver -NoService
      - name: Start the Windows Host
        if: runner.os == 'Windows'
        shell: bash
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "$LOCALAPPDATA/appium-xa11y/host.ps1" > appium.log 2>&1 &
      - name: Wait for Appium
        shell: bash
        run: |
          for _ in $(seq 90); do curl -sf "$OPTICS_E2E_XA11Y_URL/status" > /dev/null && exit 0; sleep 2; done
          echo "Appium did not start" >&2
          exit 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: |
          pip install --no-cache-dir --only-binary=:all: poetry==2.4.1
      - name: Install dependencies
        env:
          POETRY_INSTALLER_ONLY_BINARY: ':all:'
          POETRY_INSTALLER_NO_BINARY: 'csscompressor,jsmin'
        run: |
          poetry install --with test --extras appium --extras llm --extras mcp
          poetry run pip install --only-binary=:all: robotframework==7.5.1
      - name: Run the desktop suite
        run: poetry run pytest -c pytest.toml --no-cov -q tests/integration/desktop
      - name: Collect the Appium log
        if: failure()
        shell: bash
        run: if [ "$RUNNER_OS" = Linux ]; then docker logs appium > appium.log 2>&1; fi
      - if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: appium-log-${{ matrix.platform }}
          path: appium.log
          if-no-files-found: ignore

  # Windows-only, and deliberately not run on pull requests: the pytest matrix
  # above already runs real suites in headless Chromium on every OS. This job
  # adds the CLI installed the way a user installs it, scaffolding and running
  # the sample, so it runs where releases are cut from instead.
  playwright-sample:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: |
          pip install --no-cache-dir --only-binary=:all: poetry==2.4.1
      # Only the runtime group: this job runs the CLI the way a user installs
      # it, and the docs group's csscompressor ships no wheel for ':all:'.
      - name: Install dependencies
        env:
          POETRY_INSTALLER_ONLY_BINARY: ':all:'
        run: poetry install --only main --extras playwright
      - name: Install Chromium
        run: poetry run playwright install chromium
      - name: Scaffold the Playwright sample
        run: poetry run optics init demo --template playwright
      - name: Diagnose the project
        run: poetry run optics doctor demo --check
      - name: Execute the suite
        run: poetry run optics execute demo
      - name: Check the run left usable artefacts
        run: |
          $out = Join-Path 'demo' 'execution_output'
          $report = Join-Path $out 'junit_output.xml'
          if (-not (Test-Path -LiteralPath $report)) {
            throw "No JUnit report at $report - the run wrote nothing under execution_output."
          }
          [xml]$junit = Get-Content -LiteralPath $report
          $tests = 0; $failures = 0; $errors = 0
          foreach ($suite in @($junit.testsuites.testsuite)) {
            $tests += [int]$suite.tests
            $failures += [int]$suite.failures
            $errors += [int]$suite.errors
          }
          # `optics execute` exits 0 on an empty result set, so without this an
          # empty report would read as a green run that executed nothing.
          if ($tests -eq 0) {
            throw "JUnit report lists no test cases."
          }
          if ($failures -ne 0 -or $errors -ne 0) {
            throw "JUnit report lists $failures failure(s) and $errors error(s)."
          }
          # save_screenshot swallows a rejected path (cv2.imwrite returns False
          # rather than raising), so a dropped capture would still exit 0.
          $shots = @(Get-ChildItem -LiteralPath $out -Filter '*.jpg' -File)
          if ($shots.Count -eq 0) {
            throw "No screenshot under execution_output - capture dropped its output silently."
          }
          Write-Host "$tests test case(s) passed, $($shots.Count) screenshot(s) saved."
      - name: Upload execution output
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: windows-execution-output
          path: demo/execution_output/
          if-no-files-found: ignore
