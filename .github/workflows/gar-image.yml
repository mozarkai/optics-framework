name: Build and push optics-server image

# Push a tag -> a matching image lands in Artifact Registry.
#
# The tag drives everything: git tag `1.10.4` (or `v1.10.4`) produces
# `<GAR_IMAGE>:1.10.4`. Deployment is a separate, manual concern.
#
# Repository configuration (Settings -> Secrets and variables -> Actions):
#   vars.GAR_IMAGE        full image path, no tag, e.g.
#                         asia-south1-docker.pkg.dev/<project>/<repo>/optics-server
#   vars.OPTICS_EXTRAS    comma-separated extras, e.g. mcp,llm,appium,google-vision
#   vars.VISION_BACKEND   easyocr | google-vision | pytesseract
#   secrets.GCP_SA_KEY    JSON key for a service account holding
#                         roles/artifactregistry.writer on the target repo
#
# This is a long-lived credential. Prefer Workload Identity Federation once
# roles/iam.workloadIdentityPoolAdmin is available: swap credentials_json for
# workload_identity_provider + service_account on the auth step below, and give
# the job `id-token: write`. Nothing else changes.

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build, e.g. 1.10.4"
        required: true
      force:
        description: "Overwrite the image if this tag already exists"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-push:
    # Never run on forks: the registry and credentials are Mozark-specific.
    if: github.repository == 'mozarkai/optics-framework'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve configuration and tag
        id: cfg
        env:
          GAR_IMAGE: ${{ vars.GAR_IMAGE }}
          # Presence only — never put the key itself in a shell variable.
          HAVE_KEY: ${{ secrets.GCP_SA_KEY != '' }}
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$GAR_IMAGE" ]        || missing="$missing vars.GAR_IMAGE"
          [ "$HAVE_KEY" = "true" ]   || missing="$missing secrets.GCP_SA_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository configuration:$missing"
            exit 1
          fi

          # Image tags carry no leading "v"; git tags may.
          version="${RAW_TAG#v}"
          if [ -z "$version" ]; then
            echo "::error::Could not resolve a tag to build"
            exit 1
          fi

          {
            echo "raw=$RAW_TAG"
            echo "version=$version"
            echo "host=${GAR_IMAGE%%/*}"
            echo "path=${GAR_IMAGE#*/}"
          } >> "$GITHUB_OUTPUT"
          echo "Building git tag '$RAW_TAG' as ${GAR_IMAGE}:${version}"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.cfg.outputs.raw }}
          persist-credentials: false

      - name: Verify Dockerfile supports OPTICS_EXTRAS
        env:
          EXTRAS: ${{ vars.OPTICS_EXTRAS }}
        run: |
          set -euo pipefail
          # Docker only warns about an unconsumed --build-arg, so a tag cut
          # before this arg existed would silently produce an image with no
          # extras. Fail loudly instead.
          if [ -n "$EXTRAS" ] && ! grep -q 'ARG OPTICS_EXTRAS' Docker/dev/Dockerfile; then
            echo "::error::This tag predates the OPTICS_EXTRAS build arg; extras '$EXTRAS' would be silently dropped."
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pip install --no-cache-dir --only-binary=:all: poetry==2.4.1 packaging

      - name: Build wheel
        run: poetry build --format wheel

      - name: Check wheel version matches the tag
        id: wheel
        env:
          VERSION: ${{ steps.cfg.outputs.version }}
        run: |
          set -euo pipefail
          whl="$(ls dist/*.whl | tail -1)"
          name="$(basename "$whl")"
          wheel_version="$(echo "$name" | cut -d- -f2)"
          # PEP 440 comparison, so tag 1.9.0-beta.1 matches wheel 1.9.0b1.
          python - "$VERSION" "$wheel_version" <<'PY'
          import sys
          from packaging.version import InvalidVersion, Version

          tag, wheel = sys.argv[1], sys.argv[2]
          try:
              ok = Version(tag) == Version(wheel)
          except InvalidVersion as exc:
              print(f"::error::Cannot compare versions: {exc}")
              sys.exit(1)
          if not ok:
              print(
                  f"::error::Tag {tag} does not match wheel version {wheel}. "
                  "Did you cut a release without bumping pyproject.toml?"
              )
              sys.exit(1)
          PY
          echo "file=$name" >> "$GITHUB_OUTPUT"
          echo "Wheel $name matches tag $VERSION"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Log in to Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ steps.cfg.outputs.host }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Refuse to overwrite an existing tag
        if: ${{ !inputs.force }}
        env:
          HOST: ${{ steps.cfg.outputs.host }}
          IMAGE_PATH: ${{ steps.cfg.outputs.path }}
          VERSION: ${{ steps.cfg.outputs.version }}
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://${HOST}/v2/${IMAGE_PATH}/manifests/${VERSION}")"
          if [ "$code" = "200" ]; then
            echo "::error::${HOST}/${IMAGE_PATH}:${VERSION} already exists. A tag that changes underneath a running fleet is not debuggable — cut a new version, or re-run with force."
            exit 1
          fi
          echo "Tag is free (HTTP $code)"

      - name: Build image
        env:
          GAR_IMAGE: ${{ vars.GAR_IMAGE }}
          VERSION: ${{ steps.cfg.outputs.version }}
          WHL_FILE: ${{ steps.wheel.outputs.file }}
          EXTRAS: ${{ vars.OPTICS_EXTRAS }}
          VISION_BACKEND: ${{ vars.VISION_BACKEND }}
        run: |
          set -euo pipefail
          docker build \
            --progress=plain \
            -f Docker/dev/Dockerfile \
            --build-arg WHL_FILE="$WHL_FILE" \
            --build-arg OPTICS_EXTRAS="$EXTRAS" \
            --build-arg VISION_BACKEND="${VISION_BACKEND:-easyocr}" \
            -t "${GAR_IMAGE}:${VERSION}" \
            .

      - name: Verify the extras are actually installed
        env:
          GAR_IMAGE: ${{ vars.GAR_IMAGE }}
          VERSION: ${{ steps.cfg.outputs.version }}
          EXTRAS: ${{ vars.OPTICS_EXTRAS }}
          VISION_BACKEND: ${{ vars.VISION_BACKEND }}
        run: |
          set -euo pipefail
          # One import per requested extra. This is the check that catches a
          # silently-dropped extras list, whatever the mechanism.
          checks=""
          add() { checks="${checks}$1 "; }
          case ",$EXTRAS," in *,mcp,*)           add "import fastmcp;" ;; esac
          case ",$EXTRAS," in *,llm,*)           add "from google import genai;" ;; esac
          case ",$EXTRAS," in *,appium,*)        add "import appium;" ;; esac
          case ",$EXTRAS," in *,selenium,*)      add "import selenium;" ;; esac
          case ",$EXTRAS," in *,playwright,*)    add "import playwright;" ;; esac
          case ",$EXTRAS," in *,google-vision,*) add "from google.cloud import vision;" ;; esac
          case "$VISION_BACKEND" in
            google-vision) add "from google.cloud import vision;" ;;
            easyocr)       add "import easyocr;" ;;
            pytesseract)   add "import pytesseract;" ;;
          esac

          docker run --rm "${GAR_IMAGE}:${VERSION}" \
            python -c "${checks}print('imports ok')"
          docker run --rm "${GAR_IMAGE}:${VERSION}" optics --version

      - name: Push image
        env:
          GAR_IMAGE: ${{ vars.GAR_IMAGE }}
          VERSION: ${{ steps.cfg.outputs.version }}
        run: |
          set -euo pipefail
          docker push "${GAR_IMAGE}:${VERSION}"
          {
            echo "### Image pushed"
            echo
            echo '```'
            echo "${GAR_IMAGE}:${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
