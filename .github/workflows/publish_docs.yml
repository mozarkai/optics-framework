name: Build-mkdocs-docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      # jsmin/csscompressor are sdist-only on PyPI, hence --no-binary.
      # Versions come from poetry.lock (single source of truth) via scripts/lock_pins.py.
      - run: |
          eval "$(python3 scripts/lock_pins.py)"
          pip install --no-cache-dir --only-binary=:all: --no-binary=jsmin,csscompressor \
            mkdocs-material==$MKDOCS_MATERIAL_VERSION "mkdocstrings[python]==$MKDOCSTRINGS_VERSION" \
            mkdocstrings-python==$MKDOCSTRINGS_PYTHON_VERSION mkdocs-minify-plugin==$MKDOCS_MINIFY_PLUGIN_VERSION
      - run: mkdocs build
      - if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1
      - if: github.event_name == 'pull_request'
        env:
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/generate_pr_diff.py
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: docs-site
          path: site/
      - if: github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.number }}" > pr_num
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: pr_num
          path: pr_num

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      # Versions come from poetry.lock (single source of truth) via scripts/lock_pins.py.
      - run: |
          eval "$(python3 scripts/lock_pins.py)"
          pip install --no-cache-dir --only-binary=:all: --no-binary=jsmin,csscompressor \
            mkdocs-material==$MKDOCS_MATERIAL_VERSION "mkdocstrings[python]==$MKDOCSTRINGS_VERSION" \
            mkdocstrings-python==$MKDOCSTRINGS_PYTHON_VERSION mkdocs-minify-plugin==$MKDOCS_MINIFY_PLUGIN_VERSION
      - run: mkdocs build --site-dir /tmp/docs-site
      - name: Publish site to gh-pages, preserving PR previews
        run: |
          git fetch --depth=1 origin gh-pages
          git checkout --detach origin/gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'pr-preview' -exec rm -rf {} +
          cp -a /tmp/docs-site/. .
          touch .nojekyll
          git add -A
          git diff --cached --quiet || git commit -m "Deploy docs from ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
