# Set up Appium and appium-xa11y-driver on this Mac first: https://optics-framework.org/docs/platforms/desktop
driver_sources:
  - appium:
      enabled: true
      url: "http://127.0.0.1:4723"
      capabilities:
        platformName: Mac
        automationName: Xa11y
        app: com.apple.TextEdit
        appArguments: ["-ApplePersistenceIgnoreState", "YES"]

elements_sources:
  - appium_find_element:
      enabled: true
  - appium_page_source:
      enabled: true
  - appium_screenshot:
      enabled: true
