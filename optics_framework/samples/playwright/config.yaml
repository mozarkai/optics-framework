# --------------------------------------------------
# Logging
# --------------------------------------------------
console: true
file_log: true
json_log: false
log_level: INFO

# --------------------------------------------------
# Runtime behavior
# --------------------------------------------------
halt_duration: 0.2

# --------------------------------------------------
# Drivers
# --------------------------------------------------
driver_sources:
  - playwright:
      enabled: true
      # A remote browser's endpoint here connects to it instead of launching one,
      # e.g. url: "wss://<grid>/<path>?<provider options>" with capabilities
      # protocol: cdp (or playwright) and headers: {Authorization: Bearer ${GRID_TOKEN}}.
      url: null
      capabilities:
        browser: chromium
        headless: false
        slow_mo: 300

# --------------------------------------------------
# Element sources
# --------------------------------------------------
elements_sources:
  - playwright_find_element:
      enabled: true
      url: null
      capabilities: {}
  - playwright_page_source:
      enabled: true
      url: null
      capabilities: {}
  - playwright_screenshot:
      enabled: true
      url: null
      capabilities: {}

# --------------------------------------------------
# OCR
# --------------------------------------------------
text_detection:
  - easyocr:
      enabled: false
      url: null
      capabilities: {}

# --------------------------------------------------
# Image detection
# --------------------------------------------------
image_detection:
  - templatematch:
      enabled: false
      url: null
      capabilities: {}
