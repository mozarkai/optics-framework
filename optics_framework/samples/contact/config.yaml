driver_sources:
  - appium:
      enabled: true
      url: "http://localhost:4723"
      capabilities:
        app_param:
        appActivity: com.android.contacts.activities.PeopleActivity
        appPackage: com.google.android.contacts
        automationName: UiAutomator2
        deviceName: emulator-5554
        platformName: Android

elements_sources:
  - appium_find_element:
      enabled: true
  - appium_page_source:
      enabled: true
  - appium_screenshot:
      enabled: true

text_detection:
  - easyocr:
      enabled: true


image_detection:
  - templatematch:
      enabled: false

# Natural-language mode for `optics live` (Ctrl-N) and AI self-heal. Enable one engine and
# install its extra: pip install 'optics-framework[gemini]' (or [openai], [anthropic]).
# Keys come from the environment only; never commit them here.
llm_models:
  - gemini:                          # GEMINI_API_KEY, or Vertex AI via GOOGLE_GENAI_USE_VERTEXAI
      enabled: false
      capabilities:
        model: gemini-2.5-flash
  - openai:                          # OPENAI_API_KEY; also OpenRouter, Azure, Ollama, vLLM via url
      enabled: false
      # url: https://openrouter.ai/api/v1
      capabilities:
        model: gpt-5-mini
        # api_key_env: OPENROUTER_API_KEY
  - anthropic:                       # ANTHROPIC_API_KEY; platform: bedrock / vertex also work
      enabled: false
      capabilities:
        model: claude-sonnet-5-5

# AI self-heal: when every normal locate strategy fails for a keyword, an LLM inspects the
# screen and takes a corrective device action (tap/type/swipe/scroll) to land the keyword.
# OFF by default; requires an enabled `llm_models` entry above. Fires only on full locate
# failure, so it costs LLM tokens only when a keyword would otherwise fail.
ai_self_heal: false

log_level: INFO

json_log: true
file_log: true
