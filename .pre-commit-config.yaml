repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: ["--fix"]
        exclude: '(__pycache__/|\.pyc$|^dist/)'
      - id: ruff
        alias: ruff-tests
        name: ruff (tests)
        args: ["--select", "PT011,PT017,B011,B015,PLR0124,PLW0129,ERA001"]
        files: ^tests/.*\.py$

  - repo: local
    hooks:
      - id: check-tests
        name: test quality
        entry: python scripts/check_tests.py
        language: python
        files: ^tests/
      - id: sonar-lint
        name: sonar rules (changed lines)
        entry: python scripts/sonar_lint.py
        language: python
        additional_dependencies: ["ruff==0.16.10", "complexipy==9.0.0"]
        types: [python]
        require_serial: true
        exclude: ^(dist|site)/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-r", "optics_framework"]
        exclude: '(__pycache__/|\.pyc$|^dist/|tests/)'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '(__pycache__/|\.pyc$|^dist/)'
      - id: end-of-file-fixer
        exclude: '(__pycache__/|\.pyc$|^dist/)'
      - id: check-yaml
        exclude: '(__pycache__/|\.pyc$|^dist/)'
      - id: check-json
        exclude: '(__pycache__/|\.pyc$|^dist/)'

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.4.1
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.16.3
    hooks:
      - id: gitleaks
        exclude: '(__pycache__/|\.pyc$|^dist/|tests/)'
